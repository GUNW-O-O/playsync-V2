# 통합 테스트와 부하테스트가 함께 쓰는 인프라.
#
# 개발용(docker-compose.yml)과 이미지는 같지만 컨테이너·포트·저장소가 전부 분리돼 있다.
# 테스트는 데이터를 지우는 코드라 오발 비용이 크기 때문에, DB 이름이나 인덱스로
# 나누는 대신 물리적으로 다른 프로세스를 쓴다. 개발 DB에 연결할 수단 자체가 없다.
#
# 저장소는 tmpfs와 영속성 해제라 컨테이너가 죽으면 데이터가 사라진다. 테스트에는
# 그게 맞고, 디스크를 안 건드리므로 개발용보다 빠르다.
#
# **부하테스트(T39~T41)가 여기 얹혔다.** 새 파일을 만들지 않은 이유가 둘이다.
# 위 성질(격리 + tmpfs + 영속성 해제)이 부하가 원하는 것과 같고, 부하용 백엔드가
# 컨테이너로 뜨면 `127.0.0.1:5433`으로는 DB에 닿을 수 없어 **같은 네트워크**에
# 있어야 한다 — 서비스 이름(`db-test:5432`)으로 붙는다.
#
# 부하용 서비스는 전부 `profiles`가 붙어 있어 프로파일을 켜지 않으면 뜨지 않는다.
# 그래서 `npm run test:int`의 동작은 이 변경 전과 같다.
#
#   docker compose -f docker-compose.test.yml up -d                    통합 테스트용(지금까지와 동일)
#   docker compose -f docker-compose.test.yml --profile load up -d     + 백엔드(1코어)
#
# **같은 저장소를 나눠 쓴다.** 부하 실행 중에 `npm run test:int`를 돌리면 서로
# 데이터를 지운다. 구조로 막을 수 없어 적어 둔다 — 통합 테스트와 부하테스트를
# 동시에 돌리지 않는다.

services:
  db-test:
    image: postgres:18
    container_name: playsync-db-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: playsync_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d playsync_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis:7
    container_name: playsync-redis-test
    ports:
      - "127.0.0.1:6380:6379"
    # 개발용과 달리 AOF/RDB를 끈다. 테스트는 영속성이 필요 없고, 끄면 더 빠르다.
    command: redis-server --save "" --appendonly no --requirepass test
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  # ── 부하테스트 ──────────────────────────────────────────────────────────
  # 프로파일 `load`를 켜야 뜬다.

  backend-load:
    profiles: ["load"]
    build:
      # 컨텍스트가 리포 루트다. 워크스페이스 모노레포라 `packages/contract`와
      # 루트 lock이 있어야 설치·빌드가 성립한다.
      context: ..
      dockerfile: backend/Dockerfile
    container_name: playsync-backend-load
    # **여기가 이 티켓의 핵심이다.** t4g.micro급 한 코어로 묶는다.
    #
    # `deploy.resources` 대신 이 두 필드를 쓰는 이유: 전자는 swarm 문법이라
    # `docker compose up`에서 조용히 무시되는 경우가 있다. 아래 둘은 compose가
    # 직접 해석한다.
    #
    # DB와 Redis에는 제한을 걸지 않는다. 서버 인스턴스와 관리형 데이터 스토어를
    # 나누는 것이 맞는 구성이고, 셋을 한 예산에 넣으면 병목이 어디인지 분리되지
    # 않아 "그래서 무엇을 고치나"가 나오지 않는다(설계 문서의 "측정 환경").
    cpus: 1
    mem_limit: 512m
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      # 컨테이너 안에서는 localhost가 자기 자신이라 서비스 이름으로 붙는다.
      DATABASE_URL: postgresql://test:test@db-test:5432/playsync_test
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      REDIS_PASSWORD: test
      # **V8 힙 상한을 명시한다.** 노드는 cgroup 한도(512MB)를 보고 힙을
      # 259MB로 자동 설정하는데, 소켓 12,000개 부근에서 그 상한을 먼저 넘겨
      # `Ineffective mark-compacts near heap limit`으로 프로세스가 abort한다
      # (실측: 1,310테이블 · rss 398MB · OOMKilled=false). 컨테이너에는 그때
      # 114MB가 남아 있었다 — **죽인 것은 인스턴스 크기가 아니라 기본 힙**이다.
      #
      # rss = 힙 + 소켓/버퍼(외부)라 상한을 컨테이너 한도까지 올리면 이번에는
      # 커널이 죽인다. 실측 외부 사용량이 약 140MB라 340으로 둔다.
      NODE_OPTIONS: --max-old-space-size=340
      PORT: 3001
      # 부하용 고정값. 진짜 비밀이 아니고, 이미지에 굽지 않고 여기서 넣는다.
      JWT_SECRET: load-test-secret
      WS_ALLOWED_ORIGINS: http://localhost:3000
      # 대회를 인원과 무관하게 시작시킨다. 램프가 테이블 수를 축으로 삼으므로
      # 운영 기본값(6)에 걸리면 작은 규모를 잴 수 없다.
      MIN_PLAYERS_TO_START: 2
      # 이것이 켜져야 `/internal/metrics`가 뜨고 이벤트 루프 지연 수집이 돈다.
      # 기본값(미설정)이면 둘 다 일어나지 않는다.
      LOAD_METRICS: 1
      # 요청율 상한을 무대에 맞춘다(T53). k6는 컨테이너 하나라 **모든 가상
      # 사용자가 한 주소에서 온다** — 운영 기본값(분당 600 / 인증 120)이면
      # 램프가 자기 자신에게 막힌다. 끄는 스위치를 두지 않고 값만 올린 이유는,
      # 제한 코드가 부하에서도 그대로 실행돼야 "켜면 무너지는" 상태가 안
      # 생기기 때문이다. 근거는 `src/auth/throttle.ts`.
      THROTTLE_LIMIT: 100000
      THROTTLE_AUTH_LIMIT: 100000
      # `NEW_USER_RATIO`(load/lib/table.js) 분기가 실행 중에 만드는 신규 가입
      # 봇의 초기 포인트. 없으면 0으로 나와 `PaymentService.joinSession`의
      # `user.points < session.entryFee` 게이트가 409로 막는다(C-2). 값은
      # `seed-load.ts`의 `BOT_POINTS`와 같은 변수라 — 여기서 안 맞추면 풀
      # 계정과 실행 중 신규 계정의 잔고가 벌어진다.
      SIGNUP_INITIAL_POINTS: 100000000
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

  # T40이 스크립트를 붙인다. 지금은 자리만 있고 실행할 봇이 없다.
  #
  # **k6에도 상한을 건다 — 다만 넉넉하게.** 원래는 걸지 않았다("측정기가
  # 피측정자를 굶기면 재는 것이 서버가 아니라 측정기가 된다"). 그런데 VU
  # 660짜리 램프에서 정확히 **반대 방향으로 같은 일**이 났다: k6가 VU를
  # 세우며 호스트의 코어를 전부 먹었고, 호스트가 포화되면 백엔드의
  # `cpus: 1`은 상한일 뿐 하한이 아니라서 서버가 CPU 10%인데도 이벤트 루프
  # 지연이 180ms로 튀어 붕괴 판정에 걸렸다.
  #
  # 그래서 k6에는 호스트 코어의 대부분만 준다. 원래 이유는 그대로 살아 있으므로
  # **k6가 자기 상한에 붙으면 그 실행의 수치는 서버의 것이 아니다** — 실행 중
  # `docker stats`로 확인한다.
  k6:
    profiles: ["k6"]
    image: grafana/k6:latest
    container_name: playsync-k6
    cpus: 10
    environment:
      BASE_URL: http://backend-load:3001
      WS_URL: ws://backend-load:3001
    volumes:
      - ../load:/load
    depends_on:
      - backend-load
