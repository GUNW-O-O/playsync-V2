# 개발용 인프라 + 데모 시드.
#
# 앱(backend/frontend)은 여기 없다. Dockerfile이 없고, 호스트에서
# `npm run dev:backend` / `npm run dev:frontend`로 돌리는 것이 이 리포의 방식이다.
# 컨테이너는 상태를 가진 것(PostgreSQL, Redis)만 맡는다.
services:
  db:
    image: postgres:18
    container_name: playsync-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: playsync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql # 데이터 영구 저장
    # 시드가 기다릴 대상이다. `depends_on`의 기본값(service_started)은 컨테이너가
    # 떴다는 뜻일 뿐 postgres가 접속을 받는다는 뜻이 아니라, 시드가 연결 거부로 죽는다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d playsync"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    container_name: playsync-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --save 60 1 # 데이터 유실 방지(AOF 활성화)
    volumes:
      - redisdata:/data # Redis 데이터 영구 저장
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 마이그레이션 + 데모 시드를 한 번 돌리고 끝나는 일회성 컨테이너다.
  # `docker compose up`이 db·redis에 이어 이것까지 마치면 데모 무대가 선다.
  #
  # **node_modules를 이름 있는 볼륨에 따로 둔다.** 호스트(Windows)에서 설치한
  # `bcrypt`는 네이티브 모듈이라 리눅스 컨테이너에서 로드되지 않는다. 소스만
  # 마운트하고 의존성은 컨테이너 안에서 설치해야 한다. 대신 첫 실행이 `npm ci`
  # 만큼 느리고(수 분), 볼륨이 남아 있는 한 이후 실행은 설치를 건너뛴다.
  #
  # 컨테이너를 쓰지 않는 빠른 길도 있다 — 호스트에서 `npm run seed -w backend`.
  # 어느 쪽이든 같은 `prisma/seed.ts`를 돈다.
  seed:
    image: node:22
    container_name: playsync-seed
    working_dir: /app
    environment:
      # 컨테이너 안에서는 localhost가 자기 자신이라 서비스 이름으로 붙는다.
      DATABASE_URL: postgresql://root:${DATABASE_PASSWORD}@db:5432/playsync
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ../:/app
      - seed_root_modules:/app/node_modules
      - seed_backend_modules:/app/backend/node_modules
      - seed_frontend_modules:/app/frontend/node_modules
      - seed_contract_modules:/app/packages/contract/node_modules
    # `prisma generate`가 따로 필요하다. `npm ci`는 돌려 주지 않고(postinstall이
    # 없다), 호스트가 만들어 둔 클라이언트는 node_modules를 볼륨으로 갈랐으니
    # 여기서 보이지 않는다. 없으면 `@prisma/client`가 타입을 하나도 내보내지
    # 않아 시드가 TS2305로 죽는다.
    command: >
      sh -c "npm ci &&
             cd backend &&
             npx prisma generate &&
             npx prisma migrate deploy &&
             npx prisma db seed"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  seed_root_modules:
  seed_backend_modules:
  seed_frontend_modules:
  seed_contract_modules:
